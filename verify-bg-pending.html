<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background Check Started — NextUp Services</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0e0e0e;color:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:440px;width:100%;text-align:center;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:44px 32px;}
  .brand{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:26px;color:#fff;margin-bottom:28px;}
  .check{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
  .check svg{width:38px;height:38px;stroke:#22c55e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  h1{font-size:22px;font-weight:700;margin-bottom:12px;}
  p{font-size:15px;line-height:1.6;color:#b5b5b5;margin-bottom:10px;}
  .btn{display:inline-block;margin-top:22px;background:#22c55e;color:#000;font-weight:600;font-size:15px;text-decoration:none;padding:13px 28px;border-radius:10px;}
  .small{font-size:12px;color:#7a7a7a;margin-top:24px;line-height:1.5;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">NextUp</div>
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Background check started</h1>
    <p>Thanks &mdash; your background check is underway.</p>
    <p>Results usually take <strong style="color:#f5f5f5;">1&ndash;3&nbsp;days</strong>, and we&rsquo;ll email you the moment it&rsquo;s complete.</p>
    <a class="btn" href="https://app.nextupservices.com">Return to NextUp &rsaquo;</a>
    <div class="small">Questions? Just reply to the email from Natalie at NextUp Services and we&rsquo;ll help.</div>
  </div>
</body>
</html>
